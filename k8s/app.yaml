# Local kind lab only. Load the image before applying this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-first-pipeline
spec:
  replicas: 2
  selector:
    matchLabels: {app: devops-first-pipeline}
  template:
    metadata:
      labels: {app: devops-first-pipeline}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: devops-first-pipeline:local
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devops-first-pipeline
spec:
  selector: {app: devops-first-pipeline}
  ports: [{port: 8000, targetPort: 8000}]
