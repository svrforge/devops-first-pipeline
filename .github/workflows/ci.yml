name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile and test
        run: |
          python -m compileall -q app.py learn.py tests scripts labs/observability
          python -m unittest discover -s tests -v
          python scripts/validate_course.py
          node --test tests/academy.test.cjs
          node --check academy/app.js
          node --check academy/core.js
      - name: Check shell syntax
        run: bash -n scripts/*.sh
  container:
    name: Docker build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose
        run: docker compose config -q
      - name: Build image
        run: docker build --pull -t devops-first-pipeline:ci .
      - name: Verify real running container
        run: bash scripts/container-check.sh devops-first-pipeline:ci
